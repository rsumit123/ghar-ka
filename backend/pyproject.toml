[project]
name = "gharka-backend"
version = "0.1.0"
description = "Hyperlocal home-food marketplace API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
